[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
